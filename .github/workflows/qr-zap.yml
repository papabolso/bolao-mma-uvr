# Compila o app Android "QR Zap" (pasta qr-whatsapp/). Não mexe no bolão.
name: QR Zap (APK)

on:
  push:
    paths:
      - "qr-whatsapp/**"
      - ".github/workflows/qr-zap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qr-whatsapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk qr-zap.apk
      - uses: actions/upload-artifact@v4
        with:
          name: qr-zap-apk
          path: qr-whatsapp/qr-zap.apk
      - name: Publicar na release "qr-zap" (baixar direto pelo celular)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: qr-zap
          name: QR Zap (último build)
          make_latest: false
          files: qr-whatsapp/qr-zap.apk
