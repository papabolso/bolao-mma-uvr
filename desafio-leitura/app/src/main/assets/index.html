<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Desafio de Leitura</title>
<style>
:root{
  --fundo:#14110e; --sup:#1e1a16; --sup2:#29231d; --linha:#352d25;
  --tinta:#f4ebdb; --tinta2:#b9ad99; --apagado:#857a6b;
  --ouro:#dcb872; --trilho:#2c261f;
  --serif:"Noto Serif","Droid Serif",Georgia,serif;
  --sans:system-ui,-apple-system,"Roboto","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--fundo);color:var(--tinta);font-family:var(--sans);
  -webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body{min-height:100vh;padding:0 16px 56px;
  background:radial-gradient(120% 420px at 50% -120px,#3a2a1a 0%,rgba(58,42,26,0) 70%) no-repeat var(--fundo)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit;color:inherit}
.app{max-width:480px;margin:0 auto}

/* topo */
.topo{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px}
.marca{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ouro);font-weight:600}
.btn-ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--tinta2)}
.btn-ic:active{background:var(--sup2)}
.btn-ic svg{width:20px;height:20px}

.dia{display:flex;align-items:center;justify-content:space-between;margin:2px 0 4px}
.dia h1{font-family:var(--serif);font-weight:400;font-size:22px;line-height:1.15;margin:0;text-align:center;flex:1;min-width:0}
.dia h1 small{display:block;font-family:var(--sans);font-size:12px;color:var(--apagado);letter-spacing:.04em;margin-top:3px}
.dia h1 small b{color:var(--ouro);font-weight:600}
.btn-ic[disabled]{opacity:.25}

/* anel */
.heroi{display:flex;flex-direction:column;align-items:center;padding:14px 0 6px}
.anel{position:relative;width:min(64vw,248px);aspect-ratio:1}
.anel svg{width:100%;height:100%;transform:rotate(-90deg)}
.anel circle{fill:none;stroke-width:13}
.anel .seg{transition:stroke-dasharray .45s cubic-bezier(.3,.8,.3,1),stroke-dashoffset .45s cubic-bezier(.3,.8,.3,1)}
.centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.num{font-family:var(--serif);font-size:clamp(52px,19vw,76px);line-height:.95;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.de{font-size:13px;color:var(--tinta2);margin-top:6px}
.status{margin-top:8px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--apagado)}
.status.ok{color:var(--ouro)}

.meta{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--sup);border:1px solid var(--linha);
  border-radius:999px;padding:5px}
.meta span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--apagado);padding-left:12px}
.meta button{width:38px;height:38px;border-radius:50%;background:var(--sup2);font-size:20px;line-height:1;color:var(--tinta)}
.meta button:active{background:var(--linha)}
.meta input{width:58px;text-align:center;background:none;border:0;outline:0;font-family:var(--serif);font-size:22px;
  font-variant-numeric:tabular-nums;padding:0}

/* seções */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:30px 2px 10px}
.sec h2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--apagado);font-weight:600;margin:0}
.sec button{font-size:13px;color:var(--ouro);font-weight:600;padding:6px 2px}

/* livros */
.livro{position:relative;background:var(--sup);border:1px solid var(--linha);border-radius:18px;padding:16px 16px 16px 22px;
  margin-bottom:12px;overflow:hidden}
.livro::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--cor)}
.l-topo{display:flex;align-items:flex-start;gap:10px}
.l-nome{flex:1;min-width:0}
.l-nome h3{font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.2;margin:0}
.l-nome p{margin:3px 0 0;font-size:12.5px;color:var(--tinta2)}
.l-lidas{text-align:right;flex:none}
.l-lidas b{display:block;font-family:var(--serif);font-weight:400;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.l-lidas span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--apagado)}
.campos{display:grid;grid-template-columns:1fr 20px 1fr;align-items:end;gap:6px;margin-top:14px}
.campo label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--apagado);margin-bottom:6px}
.campo input{width:100%;height:52px;border-radius:12px;border:1px solid var(--linha);background:var(--fundo);
  text-align:center;font-family:var(--serif);font-size:24px;font-variant-numeric:tabular-nums;outline:0;padding:0 6px}
.campo input:focus{border-color:var(--cor)}
.campo input::placeholder{color:#4f463b}
.seta{height:52px;display:grid;place-items:center;color:var(--apagado)}
.aviso{font-size:12px;color:#e8a06a;margin-top:8px;display:none}
.aviso.on{display:block}
.prog{margin-top:14px;display:none}
.prog.on{display:block}
.prog-tr{height:5px;border-radius:3px;background:var(--trilho);overflow:hidden}
.prog-tr i{display:block;height:100%;border-radius:3px;background:var(--cor);transition:width .4s}
.prog p{display:flex;justify-content:space-between;margin:6px 0 0;font-size:12px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.l-nome p svg{width:12px;height:12px;margin-left:6px;vertical-align:-1px;color:var(--apagado)}
.novo{width:100%;height:52px;border:1px dashed var(--linha);border-radius:18px;color:var(--tinta2);font-size:14px}
.novo:active{background:var(--sup)}

/* gráfico */
.painel{background:var(--sup);border:1px solid var(--linha);border-radius:18px;padding:16px}
.alterna{display:flex;background:var(--fundo);border-radius:999px;padding:3px;gap:2px}
.alterna button{font-size:12px;padding:6px 12px;border-radius:999px;color:var(--tinta2);font-weight:600}
.alterna button.on{background:var(--sup2);color:var(--tinta)}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-bottom:12px}
.leg span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--tinta2)}
.leg i{width:10px;height:10px;border-radius:3px;background:var(--cor);flex:none}
.leg .lm i{width:12px;height:2px;border-radius:1px;background:var(--tinta)}
.dica{min-height:38px;font-size:12.5px;color:var(--tinta2);line-height:1.45;margin-bottom:8px}
.dica b{color:var(--tinta);font-weight:600}
.dica span{white-space:nowrap}
.dica i{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--cor);margin:0 5px 0 0}
.dica span{margin-right:10px}
.graf{display:flex;gap:8px}
.eixo{display:flex;flex-direction:column;justify-content:space-between;height:150px;font-size:10.5px;color:var(--apagado);
  text-align:right;font-variant-numeric:tabular-nums;min-width:16px}
.eixo span{line-height:1;transform:translateY(-50%)}
.eixo span:last-child{transform:translateY(50%)}
.area{flex:1;min-width:0}
.barras{position:relative;display:flex;align-items:flex-end;height:150px;border-bottom:1px solid var(--linha);
  background:linear-gradient(var(--linha),var(--linha)) 0 0/100% 1px no-repeat,
             linear-gradient(var(--linha),var(--linha)) 0 50%/100% 1px no-repeat}
.col{position:relative;flex:1;height:100%;display:flex;flex-direction:column-reverse;align-items:center;gap:2px;min-width:0}
.col .s{width:min(62%,24px);background:var(--cor);min-height:2px;flex:none}
.col .s:last-of-type{border-radius:4px 4px 0 0}
.col.sel::after{content:"";position:absolute;inset:0 1px;background:rgba(244,235,219,.06);border-radius:6px 6px 0 0}
.col .m{position:absolute;left:12%;right:12%;height:2px;border-radius:1px;background:var(--tinta);opacity:.75;transform:translateY(50%)}
.rot{display:flex;margin-top:6px}
.rot span{flex:1;min-width:0;text-align:center;font-size:10.5px;color:var(--apagado);line-height:1.3;white-space:nowrap}
.rot span.hj{color:var(--ouro);font-weight:700}
.rot span.sel{color:var(--tinta)}

/* números */
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.nums div{background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:14px 8px;text-align:center}
.nums b{display:block;font-family:var(--serif);font-weight:400;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.nums span{display:block;margin-top:6px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--apagado)}

/* histórico */
.hist{margin-top:12px;background:var(--sup);border:1px solid var(--linha);border-radius:18px;overflow:hidden}
.hist button{display:flex;align-items:center;gap:10px;width:100%;padding:12px 16px;text-align:left;border-bottom:1px solid var(--linha)}
.hist button:last-child{border-bottom:0}
.hist button:active{background:var(--sup2)}
.h-d{width:74px;flex:none;font-size:13px;color:var(--tinta2)}
.h-l{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12.5px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.h-l span{display:flex;align-items:center;gap:5px}
.h-l i{width:8px;height:8px;border-radius:2px;background:var(--cor)}
.h-t{flex:none;font-family:var(--serif);font-size:17px;font-variant-numeric:tabular-nums}
.h-t small{font-family:var(--sans);font-size:11px;color:var(--apagado)}
.h-t.ok{color:var(--ouro)}
.vazio{padding:18px 16px;font-size:13px;color:var(--apagado);text-align:center}

/* folha (modal) */
.veu{position:fixed;inset:0;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.veu.on{opacity:1;pointer-events:auto}
.folha{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--sup);border-radius:22px 22px 0 0;
  border-top:1px solid var(--linha);padding:10px 18px 26px;max-height:92vh;overflow:auto;
  transform:translateY(105%);visibility:hidden;transition:transform .26s cubic-bezier(.3,.8,.3,1),visibility 0s .26s}
.folha.on{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.3,.8,.3,1)}
.folha::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--linha);margin:0 auto 14px}
.folha h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 14px}
.f-c{margin-bottom:14px}
.f-c label{display:block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--apagado);margin-bottom:6px}
.f-c input,.f-c textarea{width:100%;height:50px;border-radius:12px;border:1px solid var(--linha);background:var(--fundo);
  padding:0 14px;font-size:16px;outline:0;color:var(--tinta);font-family:var(--sans)}
.f-c textarea{height:120px;padding:12px 14px;font-size:12px;font-family:monospace;resize:none}
.f-c input:focus,.f-c textarea:focus{border-color:var(--ouro)}
.cores{display:flex;gap:10px}
.cores button{width:40px;height:40px;border-radius:50%;background:var(--cor);border:3px solid var(--sup);outline:2px solid transparent}
.cores button.on{outline-color:var(--tinta)}
.acoes{display:flex;gap:10px;margin-top:20px}
.b1,.b2,.b3{flex:1;height:52px;border-radius:14px;font-weight:600;font-size:15px}
.b1{background:var(--ouro);color:#1b140a}
.b2{background:var(--sup2);color:var(--tinta)}
.b3{flex:none;padding:0 16px;color:#e8806a}
.nota{font-size:12.5px;color:var(--tinta2);line-height:1.5;margin:0 0 14px}
</style>
</head>
<body>
<div class="app">
  <div class="topo">
    <div class="marca">Desafio de Leitura</div>
    <button class="btn-ic" id="btBackup" aria-label="Backup">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>
    </button>
  </div>

  <div class="dia">
    <button class="btn-ic" id="btAnt" aria-label="Dia anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <h1 id="tituloDia"></h1>
    <button class="btn-ic" id="btProx" aria-label="Próximo dia"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>

  <div class="heroi">
    <div class="anel">
      <svg viewBox="0 0 200 200" id="anel"></svg>
      <div class="centro">
        <div class="num" id="numLidas">0</div>
        <div class="de" id="numDe"></div>
        <div class="status" id="status"></div>
      </div>
    </div>
    <div class="meta">
      <span>Meta do dia</span>
      <button id="metaMenos" aria-label="Diminuir meta">−</button>
      <input id="metaIn" type="number" inputmode="numeric" min="1" max="9999">
      <button id="metaMais" aria-label="Aumentar meta">+</button>
    </div>
  </div>

  <div class="sec"><h2>Livros</h2></div>
  <div id="livros"></div>
  <button class="novo" id="btNovo">+ Adicionar livro</button>

  <div class="sec"><h2>Quanto li</h2>
    <div class="alterna" id="alterna"><button data-n="7">7 dias</button><button data-n="30">30 dias</button></div>
  </div>
  <div class="painel">
    <div class="leg" id="leg"></div>
    <div class="dica" id="dica"></div>
    <div class="graf">
      <div class="eixo" id="eixo"></div>
      <div class="area"><div class="barras" id="barras"></div><div class="rot" id="rot"></div></div>
    </div>
  </div>
  <div class="nums">
    <div><b id="nSeq">0</b><span>dias seguidos</span></div>
    <div><b id="nTot">0</b><span>páginas no total</span></div>
    <div><b id="nMed">0</b><span>média por dia</span></div>
  </div>

  <div class="sec"><h2>Histórico</h2></div>
  <div class="hist" id="hist"></div>
</div>

<div class="veu" id="veu"></div>
<div class="folha" id="folha"></div>

<script>
"use strict";
// ---------- dados ----------
// Cores validadas para fundo escuro (distinguíveis também para daltônicos).
var CORES = ["#e0533d", "#3d8fd6", "#c18512", "#2aa58a", "#9a7be6", "#d55181"];
var CHAVE = "desafio-leitura-v1";
var META_PADRAO = 30;

function padrao() {
  return {
    livros: [
      { id: "l1", titulo: "A História da China", autor: "Michael Wood", cor: CORES[0], total: null },
      { id: "l2", titulo: "Os Irmãos Karamázov", autor: "Fiódor Dostoiévski", cor: CORES[1], total: null }
    ],
    dias: {},   // "AAAA-MM-DD": { meta: n, livros: { id: { ini: n, atual: n } } }
    janela: 7
  };
}
var S;
try { S = JSON.parse(localStorage.getItem(CHAVE)) } catch (e) { S = null }
if (!S || !S.livros || !S.dias) S = padrao();
function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(S)) } catch (e) {} }

// ---------- datas ----------
function iso(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2) }
function data(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]) }
function soma(k, n) { var d = data(k); d.setDate(d.getDate() + n); return iso(d) }
function hojeK() { return iso(new Date()) }
var SEM = ["domingo", "segunda", "terça", "quarta", "quinta", "sexta", "sábado"];
var SEM3 = ["dom", "seg", "ter", "qua", "qui", "sex", "sáb"];
var MES = ["janeiro", "fevereiro", "março", "abril", "maio", "junho", "julho", "agosto", "setembro", "outubro", "novembro", "dezembro"];
var MES3 = ["jan", "fev", "mar", "abr", "mai", "jun", "jul", "ago", "set", "out", "nov", "dez"];
function curto(k) { var d = data(k); return SEM3[d.getDay()] + ", " + d.getDate() + " " + MES3[d.getMonth()] }

var dia = hojeK();   // dia que está na tela
var sel = null;      // coluna tocada no gráfico

// ---------- contas ----------
function num(v) { return typeof v === "number" && isFinite(v) ? v : null }
function reg(k, id) { var d = S.dias[k]; return (d && d.livros && d.livros[id]) || {} }
// Meta vale para o dia em que foi definida e segue valendo nos seguintes.
function metaDe(k) {
  var ks = Object.keys(S.dias).filter(function (x) { return x <= k && num(S.dias[x].meta) }).sort();
  return ks.length ? S.dias[ks[ks.length - 1]].meta : META_PADRAO;
}
// Página inicial: a que foi digitada ou, se não, onde o livro parou no último dia anterior.
function iniDe(k, id) {
  var r = reg(k, id);
  if (num(r.ini) !== null) return r.ini;
  var ks = Object.keys(S.dias).filter(function (x) { return x < k && num(reg(x, id).atual) !== null }).sort();
  return ks.length ? reg(ks[ks.length - 1], id).atual : null;
}
function lidas(k, id) {
  var a = num(reg(k, id).atual), i = iniDe(k, id);
  return a === null || i === null ? 0 : Math.max(0, a - i);
}
function totalDia(k) { return S.livros.reduce(function (t, l) { return t + lidas(k, l.id) }, 0) }
function paginaAtual(id) {
  var ks = Object.keys(S.dias).filter(function (x) { return num(reg(x, id).atual) !== null }).sort();
  return ks.length ? reg(ks[ks.length - 1], id).atual : null;
}
function gravar(k, id, campo, valor) {
  var d = S.dias[k] || (S.dias[k] = {});
  var ls = d.livros || (d.livros = {});
  var r = ls[id] || (ls[id] = {});
  if (valor === null) delete r[campo]; else r[campo] = valor;
  salvar();
}

// ---------- util ----------
function $(id) { return document.getElementById(id) }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c] }) }
function ler(v) { var n = parseInt(v, 10); return isFinite(n) && n >= 0 ? n : null }
function pl(n, um, varios) { return n + " " + (n === 1 ? um : varios) }
function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".") }

// ---------- tela: dia ----------
function desenharTudo() {
  var hoje = hojeK(), d = data(dia);
  $("tituloDia").innerHTML = SEM[d.getDay()] + ", " + d.getDate() + " de " + MES[d.getMonth()] +
    "<small>" + (dia === hoje ? "<b>HOJE</b>" : dia === soma(hoje, -1) ? "ontem · toque › para voltar a hoje" : d.getFullYear() + " · dia passado") + "</small>";
  $("btProx").disabled = dia >= hoje;
  $("metaIn").value = metaDe(dia);

  $("livros").innerHTML = S.livros.map(function (l) {
    var r = reg(dia, l.id), i = iniDe(dia, l.id), a = num(r.atual);
    return '<div class="livro" style="--cor:' + l.cor + '" data-id="' + l.id + '">' +
      '<div class="l-topo"><div class="l-nome" data-ed="' + l.id + '" role="button" aria-label="Editar livro"><h3>' + esc(l.titulo) + '</h3><p>' + esc(l.autor || "editar") +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4z"/></svg></p></div>' +
      '<div class="l-lidas"><b data-r="lidas">0</b><span>páginas</span></div></div>' +
      '<div class="campos">' +
        '<div class="campo"><label>Comecei na</label><input data-c="ini" type="number" inputmode="numeric" min="0" placeholder="pág." value="' + (i === null ? "" : i) + '"></div>' +
        '<div class="seta"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>' +
        '<div class="campo"><label>Estou na</label><input data-c="atual" type="number" inputmode="numeric" min="0" placeholder="pág." value="' + (a === null ? "" : a) + '"></div>' +
      '</div>' +
      '<div class="aviso" data-r="aviso">A página atual está antes da inicial.</div>' +
      '<div class="prog" data-r="prog"><div class="prog-tr"><i></i></div><p><span data-r="pct"></span><span data-r="falta"></span></p></div>' +
      '</div>';
  }).join("");
  atualizar();
}

// Só o que é calculado (não recria os campos, para não perder o foco ao digitar).
function atualizar() {
  var meta = metaDe(dia), tot = totalDia(dia);
  $("numLidas").textContent = tot;
  $("numDe").textContent = "de " + pl(meta, "página", "páginas");
  var st = $("status");
  if (tot >= meta) { st.className = "status ok"; st.textContent = tot > meta ? "Meta batida · +" + (tot - meta) : "Meta batida" }
  else { st.className = "status"; st.textContent = tot ? "Faltam " + (meta - tot) : "Bora ler" }

  // anel: um arco por livro, proporcional à meta (ou ao total, se passou dela)
  var R = 88, C = 2 * Math.PI * R, base = Math.max(meta, tot), fenda = 3, pos = 0;
  var svg = '<circle cx="100" cy="100" r="' + R + '" stroke="#2c261f"/>';
  S.livros.forEach(function (l) {
    var n = lidas(dia, l.id); if (!n) return;
    var arco = n / base * C, vis = Math.max(1.5, arco - fenda);
    svg += '<circle class="seg" cx="100" cy="100" r="' + R + '" stroke="' + l.cor + '" stroke-linecap="butt" ' +
      'stroke-dasharray="' + vis.toFixed(2) + " " + (C - vis).toFixed(2) + '" stroke-dashoffset="' + (-pos - fenda / 2).toFixed(2) + '"/>';
    pos += arco;
  });
  $("anel").innerHTML = svg;

  S.livros.forEach(function (l) {
    var el = document.querySelector('.livro[data-id="' + l.id + '"]'); if (!el) return;
    var q = function (r) { return el.querySelector('[data-r="' + r + '"]') };
    var a = num(reg(dia, l.id).atual), i = iniDe(dia, l.id);
    q("lidas").textContent = lidas(dia, l.id);
    q("aviso").className = "aviso" + (a !== null && i !== null && a < i ? " on" : "");
    var pa = paginaAtual(l.id), prog = q("prog");
    if (l.total && pa !== null) {
      var p = Math.min(100, pa / l.total * 100);
      prog.className = "prog on";
      prog.querySelector("i").style.width = p + "%";
      q("pct").textContent = "pág. " + pa + " de " + l.total + " · " + Math.round(p) + "%";
      q("falta").textContent = pa >= l.total ? "terminado" : "faltam " + (l.total - pa);
    } else prog.className = "prog";
  });
  grafico(); numeros(); historico();
}

// ---------- gráfico ----------
function teto(v) {   // teto "redondo" e par, para o meio do eixo ser inteiro
  var passos = [10, 20, 30, 40, 50, 60, 80, 100, 120, 160, 200, 300, 400, 500, 800, 1000, 2000, 5000];
  for (var i = 0; i < passos.length; i++) if (v <= passos[i]) return passos[i];
  return Math.ceil(v / 1000) * 1000;
}
function grafico() {
  var n = S.janela === 30 ? 30 : 7, hoje = hojeK(), ks = [];
  for (var i = n - 1; i >= 0; i--) ks.push(soma(hoje, -i));
  [].forEach.call($("alterna").children, function (b) { b.className = +b.dataset.n === n ? "on" : "" });

  $("leg").innerHTML = S.livros.map(function (l) {
    return '<span style="--cor:' + l.cor + '"><i></i>' + esc(l.titulo) + '</span>';
  }).join("") + '<span class="lm"><i></i>meta</span>';

  var max = 0;
  ks.forEach(function (k) { max = Math.max(max, totalDia(k), metaDe(k)) });
  max = teto(max);
  $("eixo").innerHTML = "<span>" + max + "</span><span>" + max / 2 + "</span><span>0</span>";

  $("barras").innerHTML = ks.map(function (k) {
    var h = "";
    S.livros.forEach(function (l) {
      var v = lidas(k, l.id);
      if (v) h += '<div class="s" style="--cor:' + l.cor + ";height:" + (v / max * 100).toFixed(2) + '%"></div>';
    });
    var temDado = totalDia(k) > 0 || (S.dias[k] && num(S.dias[k].meta)) || k === hoje;
    if (temDado) h += '<div class="m" style="bottom:' + (metaDe(k) / max * 100).toFixed(2) + '%"></div>';
    return '<div class="col' + (k === sel ? " sel" : "") + '" data-k="' + k + '">' + h + "</div>";
  }).join("");

  $("rot").innerHTML = ks.map(function (k, i) {
    var d = data(k), t = "";
    if (n === 7) t = SEM3[d.getDay()] + "<br>" + d.getDate();
    else if (k === hoje || (n - 1 - i) % 5 === 0) t = d.getDate();
    return '<span class="' + (k === hoje ? "hj" : "") + (k === sel ? " sel" : "") + '">' + t + "</span>";
  }).join("");

  var k = sel && ks.indexOf(sel) >= 0 ? sel : null;
  if (!k) { $("dica").innerHTML = "Toque numa barra para ver o dia."; return }
  var tot = totalDia(k), m = metaDe(k);
  $("dica").innerHTML = "<b>" + curto(k) + " · " + pl(tot, "página", "páginas") + "</b> (meta " + m + (tot >= m ? ", batida" : "") + ")<br>" +
    S.livros.map(function (l) { return '<span><i style="--cor:' + l.cor + '"></i>' + esc(l.titulo) + " " + lidas(k, l.id) + "</span> " }).join("");
}

function numeros() {
  var hoje = hojeK(), ks = Object.keys(S.dias).filter(function (k) { return totalDia(k) > 0 });
  var tot = ks.reduce(function (t, k) { return t + totalDia(k) }, 0);
  // sequência: dias seguidos batendo a meta; hoje ainda em aberto não quebra
  var seq = 0, k = hoje;
  if (totalDia(k) < metaDe(k)) k = soma(k, -1);
  while (totalDia(k) >= metaDe(k) && totalDia(k) > 0) { seq++; k = soma(k, -1) }
  $("nSeq").textContent = seq;
  $("nTot").textContent = fmt(tot);
  $("nMed").textContent = ks.length ? Math.round(tot / ks.length) : 0;
}

function historico() {
  var ks = Object.keys(S.dias).filter(function (k) { return totalDia(k) > 0 }).sort().reverse().slice(0, 14);
  if (!ks.length) { $("hist").innerHTML = '<div class="vazio">Nada por aqui ainda. Anote as páginas de hoje.</div>'; return }
  $("hist").innerHTML = ks.map(function (k) {
    var tot = totalDia(k), m = metaDe(k);
    return '<button data-k="' + k + '"><span class="h-d">' + curto(k) + '</span><span class="h-l">' +
      S.livros.map(function (l) { var v = lidas(k, l.id); return v ? '<span style="--cor:' + l.cor + '"><i></i>' + v + "</span>" : "" }).join("") +
      '</span><span class="h-t' + (tot >= m ? " ok" : "") + '">' + tot + "<small> / " + m + "</small></span></button>";
  }).join("");
}

// ---------- folha ----------
var aberta = false;
function abrir(html) { $("folha").innerHTML = html; $("folha").classList.add("on"); $("veu").classList.add("on"); aberta = true }
function fechar() { $("folha").classList.remove("on"); $("veu").classList.remove("on"); aberta = false; if (document.activeElement) document.activeElement.blur() }
window.__voltar = function () { if (aberta) { fechar(); return true } return false };
$("veu").onclick = fechar;

function folhaLivro(id) {
  var l = id ? S.livros.filter(function (x) { return x.id === id })[0] : null;
  var usadas = S.livros.map(function (x) { return x.cor });
  var cor = l ? l.cor : (CORES.filter(function (c) { return usadas.indexOf(c) < 0 })[0] || CORES[0]);
  abrir('<h2>' + (l ? "Editar livro" : "Novo livro") + '</h2>' +
    '<div class="f-c"><label>Título</label><input id="fT" value="' + esc(l ? l.titulo : "") + '" autocomplete="off"></div>' +
    '<div class="f-c"><label>Autor</label><input id="fA" value="' + esc(l ? l.autor : "") + '" autocomplete="off"></div>' +
    '<div class="f-c"><label>Total de páginas (opcional)</label><input id="fP" type="number" inputmode="numeric" value="' + (l && l.total ? l.total : "") + '" placeholder="mostra o quanto falta do livro"></div>' +
    '<div class="f-c"><label>Cor</label><div class="cores" id="fC">' + CORES.map(function (c) {
      return '<button data-cor="' + c + '" style="--cor:' + c + '" class="' + (c === cor ? "on" : "") + '" aria-label="Cor"></button>' }).join("") + '</div></div>' +
    '<div class="acoes">' + (l ? '<button class="b3" id="fX">Excluir</button>' : "") +
    '<button class="b2" id="fN">Cancelar</button><button class="b1" id="fS">Salvar</button></div>');
  $("fC").onclick = function (e) {
    var b = e.target.closest("button"); if (!b) return;
    cor = b.dataset.cor;
    [].forEach.call($("fC").children, function (x) { x.className = x === b ? "on" : "" });
  };
  $("fN").onclick = fechar;
  $("fS").onclick = function () {
    var t = $("fT").value.trim(); if (!t) { $("fT").focus(); return }
    var total = ler($("fP").value) || null;
    if (l) { l.titulo = t; l.autor = $("fA").value.trim(); l.total = total; l.cor = cor }
    else S.livros.push({ id: "l" + Date.now(), titulo: t, autor: $("fA").value.trim(), total: total, cor: cor });
    salvar(); fechar(); desenharTudo();
  };
  if (l) $("fX").onclick = function () {
    if (this.dataset.ok) {
      S.livros = S.livros.filter(function (x) { return x.id !== l.id });
      Object.keys(S.dias).forEach(function (k) { if (S.dias[k].livros) delete S.dias[k].livros[l.id] });
      salvar(); fechar(); desenharTudo();
    } else { this.dataset.ok = 1; this.textContent = "Apagar livro e páginas?" }
  };
}

function folhaBackup() {
  abrir('<h2>Backup</h2><p class="nota">Tudo fica guardado só neste aparelho. Copie o texto abaixo e guarde (num e-mail pra você, por exemplo). ' +
    'Para restaurar, cole o texto aqui e toque em Restaurar.</p>' +
    '<div class="f-c"><textarea id="fB" spellcheck="false"></textarea></div><p class="nota" id="fM"></p>' +
    '<div class="acoes"><button class="b2" id="fR">Restaurar</button><button class="b1" id="fCp">Copiar</button></div>');
  $("fB").value = JSON.stringify(S);
  $("fCp").onclick = function () {
    $("fB").value = JSON.stringify(S); $("fB").select();
    var ok = false; try { ok = document.execCommand("copy") } catch (e) {}
    $("fM").textContent = ok ? "Copiado." : "Selecione o texto e copie.";
  };
  $("fR").onclick = function () {
    var n; try { n = JSON.parse($("fB").value) } catch (e) { n = null }
    if (!n || !Array.isArray(n.livros) || typeof n.dias !== "object") { $("fM").textContent = "Esse texto não é um backup válido."; return }
    if (!this.dataset.ok) { this.dataset.ok = 1; this.textContent = "Substituir tudo?"; return }
    S = n; salvar(); fechar(); desenharTudo();
  };
}

// ---------- eventos ----------
$("livros").addEventListener("input", function (e) {
  var c = e.target.dataset.c; if (!c) return;
  gravar(dia, e.target.closest(".livro").dataset.id, c, ler(e.target.value));
  atualizar();
});
$("livros").addEventListener("focusin", function (e) { if (e.target.select) e.target.select() });
$("livros").addEventListener("click", function (e) {
  var b = e.target.closest("[data-ed]"); if (b) folhaLivro(b.dataset.ed);
});
document.addEventListener("keydown", function (e) { if (e.key === "Enter" && e.target.tagName === "INPUT") e.target.blur() });

function defMeta(v) {
  v = Math.max(1, Math.min(9999, v || 1));
  (S.dias[dia] || (S.dias[dia] = {})).meta = v; salvar();
  if (+$("metaIn").value !== v) $("metaIn").value = v;
  atualizar();
}
$("metaMenos").onclick = function () { defMeta(metaDe(dia) - 5) };
$("metaMais").onclick = function () { defMeta(metaDe(dia) + 5) };
$("metaIn").oninput = function () { var v = ler(this.value); if (v) { (S.dias[dia] || (S.dias[dia] = {})).meta = Math.min(9999, v); salvar(); atualizar() } };
$("metaIn").onblur = function () { this.value = metaDe(dia) };
$("metaIn").onfocus = function () { this.select() };

function irPara(k) { dia = k > hojeK() ? hojeK() : k; desenharTudo(); window.scrollTo(0, 0) }
$("btAnt").onclick = function () { irPara(soma(dia, -1)) };
$("btProx").onclick = function () { irPara(soma(dia, 1)) };
$("btNovo").onclick = function () { folhaLivro(null) };
$("btBackup").onclick = folhaBackup;
$("alterna").onclick = function (e) { var b = e.target.closest("button"); if (b) { S.janela = +b.dataset.n; salvar(); grafico() } };
$("barras").onclick = function (e) { var c = e.target.closest(".col"); if (c) { sel = sel === c.dataset.k ? null : c.dataset.k; grafico() } };
$("hist").onclick = function (e) { var b = e.target.closest("button"); if (b) irPara(b.dataset.k) };

// Virou o dia com o app aberto: volta para hoje.
var ultimoHoje = hojeK();
document.addEventListener("visibilitychange", function () {
  if (!document.hidden && hojeK() !== ultimoHoje) { ultimoHoje = hojeK(); dia = ultimoHoje; desenharTudo() }
});

desenharTudo();
</script>
</body>
</html>
